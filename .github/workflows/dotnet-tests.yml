name: .NET Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run xUnit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Hospital/Hospital.sln  

    - name: Build
      run: dotnet build Hospital/Hospital.sln --no-restore --configuration Release  

    - name: Test
      run: dotnet test Hospital/Hospital.sln --no-build --configuration Release  